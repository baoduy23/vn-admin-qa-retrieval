bm25:
  k1: 1.5
  b: 0.75
tfidf:
  ngram_range: [1, 2]
  sublinear_tf: true
token_level: [syllable, word]
eval:
  ks: [1, 3, 5, 10]
  split: validation         # chỉ chạy test một lần sau khi chốt tham số
refusal:
  max_wrong_refusal: 0.1  # ngưỡng từ chối chọn trên validation: từ chối nhầm câu hợp lệ tối đa 10%
hard_negatives:
  top_k: 20               # đào negative trong top-20 BM25 mức từ, chỉ trên train
  neg_per_pos: 4          # 1 positive : 4 hard negative (hướng dẫn gợi ý 3–5)
