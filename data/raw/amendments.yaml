# data/raw/amendments.yaml — danh sách sửa đổi áp lên units.jsonl để ra units_current.jsonl
#
# Mỗi phần tử = 1 thao tác. Code sort theo effective_date (cùng ngày thì giữ thứ tự trong file) rồi áp lần lượt.
#
#   target : chỗ BỊ sửa (doc + dieu, có thể thêm khoan / diem). Không có khoan = cả Điều.
#   source : chỗ RA LỆNH sửa (doc + dieu + khoan, có thể thêm diem) trong văn bản sửa đổi.
#            Text mới KHÔNG gõ tay: code lấy các dòng trong ngoặc kép “...” của unit source.
#            Nếu đoạn trích có nhiều khoản (vd “1. ...” “2. ...”), code lấy đúng khoản trùng target.khoan.
#   op     : replace       thay nội dung target bằng đoạn trích
#            insert        thêm unit mới (target là unit chưa có; after_dieu / after_khoan = chèn sau đâu)
#            repeal        bãi bỏ target (đánh dấu repealed, không xoá dòng)
#            remove_phrase bỏ cụm từ `phrase` trong target (so khớp không phân biệt hoa thường, đã chuẩn hoá Unicode)
#            rename        đổi tên Điều thành `new_title`
#   effective_date: ngày văn bản sửa đổi có hiệu lực (YYYY-MM-DD)
#
# Ngoài phạm vi (không ghi op): 07/2025 Điều 1 (NĐ 23 chứng thực), Điều 4 (NĐ 16 quốc tịch);
# 04/2024 Điều 1 (TT 02/2020 quốc tịch), khoản 2 Điều 2 (thay Phụ lục danh mục tờ khai);
# 18/2026 các Điều trừ Điều 13; 09/2022 Điều 1; NĐ 120/2025 chỉ là affected_by (đã ghi trong source_list.csv).

